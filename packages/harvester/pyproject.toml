[project]
name = "trekk-harvester"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "The Trekk Authors" }]
dependencies = ["pydantic==2.13.*", "httpx2==2.13.*", "trekk-archive==0.1.0"]

[project.urls]
Homepage = "https://github.com/trekk-cc/trekk-cli"
Source = "https://github.com/trekk-cc/trekk-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trekk_harvester"]
